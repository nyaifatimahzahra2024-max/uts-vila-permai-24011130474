<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Permai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Villa Permai</h1>
        <p>Tempat istirahat nyaman keluarga di pegunungan</p>
    </header>

    <nav>
        <a href="#beranda">Beranda</a>
        <a href="#daftar-vila">Daftar Vila</a>
        <a href="#pemesanan">Pemesanan</a>
    </nav>

    <main>
        <!-- Bagian Pencarian & Daftar Vila -->
        <section id="daftar-vila">
            <h2>Pilihan Vila Kami</h2>
            <input type="text" id="inputPencarian" placeholder="Cari nama atau lokasi vila..." onkeyup="cariVila()">
            
            <!-- Tempat render data vila dari JavaScript (DOM createElement) -->
            <div id="containerVila" class="villa-grid"></div>
        </section>

        <!-- Bagian Formulir Pemesanan -->
        <section id="pemesanan">
            <h2>Formulir Pemesanan</h2>
            <form id="formPemesanan">
                <label for="namaTamu">Nama Tamu:</label>
                <input type="text" id="namaTamu" required>

                <label for="pilihVila">Pilih Vila:</label>
                <select id="pilihVila" required>
                    <option value="">-- Pilih Vila --</option>
                </select>

                <label for="checkIn">Tanggal Check-in:</label>
                <input type="date" id="checkIn" required>

                <label for="checkOut">Tanggal Check-out:</label>
                <input type="date" id="checkOut" required>

                <label for="jumlahTamu">Jumlah Tamu (1-10):</label>
                <input type="number" id="jumlahTamu" min="1" max="10" required>

                <button type="button" onclick="hitungTotalHarga()">Cek Ketersediaan & Harga</button>
                <button type="submit" style="margin-top: 10px;">Pesan Sekarang</button>
            </form>

            <div id="hasilHitung" style="margin-top: 15px; font-weight: bold;"></div>
        </section>

        <!-- Area Hasil / Riwayat Pesanan Terakhir -->
        <section id="riwayat">
            <h3>Pesanan Terakhir Anda</h3>
            <p id="tampilRiwayat">Belum ada pesanan.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Villa Permai. Kontak: info@villapermai.com</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
